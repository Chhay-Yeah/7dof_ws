controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7

    # POSITION command interface (2026-06-14): the JTC forwards interpolated
    # joint-angle setpoints straight to Gazebo's IgnitionSystem, which holds
    # each angle against gravity — exactly like the real DaMiao motors in
    # POS_VEL_MODE (pos_motor_sub.control_pos_vel). This replaces the previous
    # pure-velocity command interface, which had no position target: it
    # drooped under gravity and hunted on reach-direction strokes (a centred
    # vertical drawing line executed at only ~36% coverage; horizontal, which
    # is base-yaw and gravity-free, tracked fine). A naive velocity-gain bump
    # (p=10/d=3.0/i=0.5) only crashed DART. Position control removes the
    # fragile outer loop AND makes the sim a faithful proxy of the
    # position-targeted hardware. No per-joint PID gains are needed in
    # position-forwarding mode.
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
